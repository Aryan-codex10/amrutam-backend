server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  location /api/ { proxy_pass http://api:8000/api/; proxy_set_header Host $host; proxy_set_header X-Request-ID $request_id; }
  location /health/ { proxy_pass http://api:8000/health/; }
  location /metrics { proxy_pass http://api:8000/metrics; }
  location /docs { proxy_pass http://api:8000/docs; }
  location /openapi.json { proxy_pass http://api:8000/openapi.json; }
  location /openapi.yaml { proxy_pass http://api:8000/openapi.yaml; }
  location / { try_files $uri $uri/ /index.html; }
}
