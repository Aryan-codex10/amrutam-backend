openapi: 3.1.0
info:
  title: Amrutam Telemedicine API
  version: 1.0.0
  description: See README and security documentation for implemented scope and deployment assumptions.
servers:
  - url: http://localhost:8000
paths:
  /health/live:
    get: {summary: Liveness probe, responses: {'200': {description: Process is alive}}}
  /health/ready:
    get: {summary: Readiness probe, responses: {'200': {description: Dependencies ready}, '503': {description: Database unavailable}}}
  /api/v1/auth/register:
    post:
      summary: Create patient account
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Register'}
      responses: {'201': {description: Created}, '409': {description: Duplicate email}}
  /api/v1/auth/login:
    post:
      summary: Issue short-lived access token
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Login'}
      responses: {'200': {description: Bearer access token; privileged roles must include a valid TOTP code}, '401': {description: Invalid credentials or MFA code}}
  /api/v1/auth/mfa/setup:
    post: {summary: Begin TOTP enrollment for doctor/admin, security: [{bearerAuth: []}], responses: {'200': {description: Secret and authenticator provisioning URI}}}
  /api/v1/auth/mfa/verify:
    post:
      summary: Verify TOTP and enable MFA for doctor/admin
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MfaVerify'}}}
      responses: {'200': {description: MFA enabled}, '400': {description: Invalid code}}
  /api/v1/doctors:
    get:
      summary: Search doctors
      parameters:
        - {in: query, name: q, schema: {type: string}}
        - {in: query, name: specialty, schema: {type: string}}
        - {in: query, name: limit, schema: {type: integer, maximum: 100}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0}}
      responses: {'200': {description: Search results}}
  /api/v1/doctors/{doctor_id}/availability:
    get:
      summary: List available slots
      parameters:
        - {in: path, name: doctor_id, required: true, schema: {type: string}}
        - {in: query, name: from_at, required: true, schema: {type: string, format: date-time}}
        - {in: query, name: to_at, required: true, schema: {type: string, format: date-time}}
      responses: {'200': {description: Available slots}}
    post:
      summary: Publish a doctor availability slot
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Slot'}}}
      responses: {'201': {description: Slot created}, '403': {description: Wrong role or doctor}}
  /api/v1/consultations:
    get: {summary: List consultations scoped to caller, security: [{bearerAuth: []}], responses: {'200': {description: Consultations}}}
    post:
      summary: Book slot
      security: [{bearerAuth: []}]
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Booking'}}}
      responses: {'201': {description: Booked}, '409': {description: Slot conflict}}
  /api/v1/consultations/{consultation_id}/status:
    patch:
      summary: Change lifecycle state
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Status'}}}
      responses: {'200': {description: Updated}, '409': {description: Invalid transition}}
  /api/v1/consultations/{consultation_id}/prescriptions:
    get: {summary: Read prescriptions with patient/doctor authorization, security: [{bearerAuth: []}], responses: {'200': {description: Prescriptions}}}
    post:
      summary: Create prescription
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Prescription'}}}
      responses: {'201': {description: Created}}
  /api/v1/admin/doctors:
    post:
      summary: Admin provisions doctor account and profile
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Doctor'}}}
      responses: {'201': {description: Created}}
  /api/v1/admin/analytics:
    get: {summary: Aggregated admin metrics, security: [{bearerAuth: []}], responses: {'200': {description: Metrics}}}
  /metrics:
    get: {summary: Prometheus scrape endpoint, responses: {'200': {description: Metrics}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    Register:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 12}
        role: {type: string, enum: [patient]}
    Login:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
        totp_code: {type: string, pattern: '^[0-9]{6}$', description: Required after MFA has been enabled for an admin or doctor}
    MfaVerify:
      type: object
      required: [totp_code]
      properties:
        totp_code: {type: string, pattern: '^[0-9]{6}$'}
    Doctor:
      type: object
      required: [email, password, display_name, specialty]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 12, maxLength: 72}
        display_name: {type: string, minLength: 2, maxLength: 160}
        specialty: {type: string, minLength: 2, maxLength: 120}
    Slot:
      type: object
      required: [starts_at, ends_at]
      properties:
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
    Booking:
      type: object
      required: [slot_id, reason]
      properties:
        slot_id: {type: string}
        reason: {type: string, minLength: 3, maxLength: 500}
    Status:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [in_progress, completed, cancelled]}
    Prescription:
      type: object
      required: [body]
      properties:
        body: {type: string, minLength: 2, maxLength: 10000}
