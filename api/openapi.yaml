openapi: 3.1.0
info:
  title: Amrutam Telemedicine API
  version: 1.0.0
  description: See README and security documentation for implemented scope and deployment assumptions.
servers:
  - url: http://localhost:8000
paths:
  /health/live:
    get: {summary: Liveness probe, responses: {'200': {description: Process is alive}}}
  /health/ready:
    get: {summary: Readiness probe, responses: {'200': {description: Dependencies ready}, '503': {description: Database unavailable}}}
  /api/v1/auth/register:
    post:
      summary: Create patient account
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Register'}
      responses: {'201': {description: Created}, '409': {description: Duplicate email}}
  /api/v1/auth/login:
    post:
      summary: Issue short-lived access token
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Login'}
      responses: {'200': {description: Bearer access token}, '401': {description: Invalid credentials}}
  /api/v1/doctors:
    get:
      summary: Search doctors
      parameters:
        - {in: query, name: q, schema: {type: string}}
        - {in: query, name: specialty, schema: {type: string}}
        - {in: query, name: limit, schema: {type: integer, maximum: 100}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0}}
      responses: {'200': {description: Search results}}
  /api/v1/doctors/{doctor_id}/availability:
    get:
      summary: List available slots
      parameters:
        - {in: path, name: doctor_id, required: true, schema: {type: string}}
        - {in: query, name: from_at, required: true, schema: {type: string, format: date-time}}
        - {in: query, name: to_at, required: true, schema: {type: string, format: date-time}}
      responses: {'200': {description: Available slots}}
    post: {summary: Publish slot, security: [{bearerAuth: []}], responses: {'201': {description: Slot created}}}
  /api/v1/consultations:
    get: {summary: List consultations scoped to caller, security: [{bearerAuth: []}], responses: {'200': {description: Consultations}}}
    post:
      summary: Book slot
      security: [{bearerAuth: []}]
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, maxLength: 128}}
      responses: {'201': {description: Booked}, '409': {description: Slot conflict}}
  /api/v1/consultations/{consultation_id}/status:
    patch: {summary: Change lifecycle state, security: [{bearerAuth: []}], responses: {'200': {description: Updated}, '409': {description: Invalid transition}}}
  /api/v1/consultations/{consultation_id}/prescriptions:
    get: {summary: Read prescriptions with patient/doctor authorization, security: [{bearerAuth: []}], responses: {'200': {description: Prescriptions}}}
    post: {summary: Create prescription, security: [{bearerAuth: []}], responses: {'201': {description: Created}}}
  /api/v1/admin/doctors:
    post: {summary: Admin creates doctor profile, security: [{bearerAuth: []}], responses: {'201': {description: Created}}}
  /api/v1/admin/analytics:
    get: {summary: Aggregated admin metrics, security: [{bearerAuth: []}], responses: {'200': {description: Metrics}}}
  /metrics:
    get: {summary: Prometheus scrape endpoint, responses: {'200': {description: Metrics}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    Register:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 12}
        role: {type: string, enum: [patient]}
    Login:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
