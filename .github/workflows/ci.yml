name: backend-ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: amrutam_test
          POSTGRES_USER: amrutam
          POSTGRES_PASSWORD: test-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U amrutam -d amrutam_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://amrutam:test-password@localhost:5432/amrutam_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm --prefix backend run build
      - run: npm --prefix frontend run build
      - run: npm --prefix backend test
      - run: npm --prefix backend audit --omit=dev
      - run: npm --prefix frontend audit --omit=dev
      - name: Build API container
        run: docker build --tag amrutam-api:${{ github.sha }} .
      - name: Build web container
        run: docker build --tag amrutam-web:${{ github.sha }} ./frontend

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Format check
        run: terraform fmt -check -recursive infra/terraform
      - name: Initialize providers without configuring cloud state
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false
      - name: Validate infrastructure
        working-directory: infra/terraform
        run: terraform validate
